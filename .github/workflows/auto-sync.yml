name: Manual Fast-Forward Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-replit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          fetch-depth: 0

      - name: Verify Replit repository is configured
        env:
          REPLIT_URL: ${{ secrets.REPLIT_REPO_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "$REPLIT_URL" ]; then
            echo "REPLIT_REPO_URL is not configured. No changes were made."
            exit 1
          fi

      - name: Fast-forward from Replit
        env:
          REPLIT_URL: ${{ secrets.REPLIT_REPO_URL }}
        run: |
          set -Eeuo pipefail
          git remote add replit "$REPLIT_URL"
          git fetch --no-tags replit main
          git merge --ff-only replit/main
          git push origin HEAD:main
