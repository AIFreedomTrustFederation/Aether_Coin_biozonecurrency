name: Aetherion Wallet Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/wallet-frontend-startup]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (uses environment-specific credentials and HTTPS origin)'
        type: choice
        required: true
        default: staging
        options: [staging, production]
      confirm_deploy:
        description: 'Deploy the frontend-only build to the selected environment after reviewing exact-head checks'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: wallet-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: node scripts/verify-biozoecurrency-terminology.mjs
      - run: npm run qa:local
      - run: npm run test:deployment
      - run: npm audit --prefix deploy/runtime --omit=dev --audit-level=low
      - run: npm audit --audit-level=critical
  build:
    name: Build
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run check:wallet
      - run: npm run build
      - run: WALLET_BUILD_SMOKE=1 npm run test:frontend
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - name: Prepare isolated frontend runtime
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p release/dist
          cp -r dist/public release/dist/
          cp server-redirect.js release/
          cp deploy/runtime/package*.json release/
          node -e 'require("fs").writeFileSync("release/dist/public/release.json", JSON.stringify({sha:process.env.SOURCE_SHA}))'
          npm ci --prefix release --omit=dev --ignore-scripts
          PORT=4179 node release/server-redirect.js &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:4179/health >/dev/null; then break; fi
            sleep 1
          done
          GITHUB_SHA="$SOURCE_SHA" node scripts/verify-wallet-http.mjs http://127.0.0.1:4179
          tar --exclude='./node_modules' -czf aetherion-deploy.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: aetherion-artifacts
          path: aetherion-deploy.tar.gz
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Block production on unresolved high severity findings
        if: inputs.environment == 'production'
        run: npm audit --audit-level=high
      - uses: actions/download-artifact@v4
        with:
          name: aetherion-artifacts
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy and verify HTTPS routes
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HTTPS_ORIGIN: ${{ vars.DEPLOY_HTTPS_ORIGIN }}
        run: bash scripts/deploy-wallet-frontend.sh
